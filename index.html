/* ---------------- Admin: Excel export ---------------- */
document.getElementById('exportBtn').onclick = async () => {
  const fromVal = document.getElementById('fromDate').value;
  const toVal = document.getElementById('toDate').value;
  if (!fromVal || !toVal){ alert('بازه تاریخ را انتخاب کنید'); return; }
  const from = new Date(fromVal+'T00:00:00');
  const to = new Date(toVal+'T00:00:00');
  if (to < from){ alert('تاریخ پایان نمی‌تواند قبل از تاریخ شروع باشد'); return; }

  const refDate = new Date(CONFIG.refDate+'T00:00:00');
  const rows = [];
  const consRows = [];
  const shiftLabel = {day:'صبح‌کار', evening:'عصرکار', night:'شب‌کار'};

  await loadReportsStore(); // make sure the export reflects the latest sheet data
  let cursor = new Date(from);
  while (cursor <= to){
    const teams = computeTeams(cursor, refDate, CONFIG.order);
    const dStr = isoDate(cursor);
    const [cy,cm,cd] = gregorianToJalali(cursor.getFullYear(), cursor.getMonth()+1, cursor.getDate());
    const jalaliStr = `${cy}/${String(cm).padStart(2,'0')}/${String(cd).padStart(2,'0')}`;

    for (const key of ['day','evening','night']){
      const record = reportsStore[keyFor(dStr, key)] || null;
      const team = teams[key];
      if (!recordHasContent(record)){
        rows.push([dStr, jalaliStr, shiftLabel[key], team, '', '', 'بدون گزارش', '', '', '', '', '', '']);
        continue;
      }
      (record.consumables||[]).filter(c=>c.name||c.unit||c.amount||c.location).forEach((c, ci) => {
        consRows.push([dStr, jalaliStr, shiftLabel[key], team, record.supervisor||'', ci+1, c.name||'', c.unit||'', c.amount||'', c.location||'']);
      });
      const acts = (record.activities||[]).filter(a=>a.desc||a.workOrder||a.workType||(a.performedBy&&a.performedBy.length));
      const attendeesStr = (record.attendees||[]).join('، ');
      if (acts.length===0){
        rows.push([dStr, jalaliStr, shiftLabel[key], team, record.supervisor||'', attendeesStr, 'ثبت شده (بدون فعالیت)', '', '', '', '', '', '']);
      } else {
        acts.forEach((a, idx) => {
          const performedByStr = normalizePerformedBy(a).join('، ');
          const timeStr = (a.timeFrom && a.timeTo) ? `${a.timeFrom} - ${a.timeTo}` : '';
          rows.push([dStr, jalaliStr, shiftLabel[key], team, record.supervisor||'', attendeesStr, 'ثبت شده', idx+1, timeStr, a.desc||'', a.workOrder||'', a.workType||'', performedByStr]);
        });
      }
    }
    cursor.setDate(cursor.getDate()+1);
  }

  const header = ['تاریخ (میلادی)','تاریخ (شمسی)','شیفت','تیم','مسئول شیفت','حاضرین','وضعیت','ردیف فعالیت','ساعت انجام کار','شرح فعالیت','شماره دستور کار','نوع کار','انجام‌دهنده'];
  const wsData = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:12},{wch:12},{wch:10},{wch:6},{wch:16},{wch:34},{wch:16},{wch:8},{wch:13},{wch:30},{wch:14},{wch:8},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'گزارش شیفت‌ها');
  const consHeader = ['تاریخ (میلادی)','تاریخ (شمسی)','شیفت','تیم','مسئول شیفت','ردیف','نام قلم مصرفی','واحد','مقدار','محل مصرف'];
  const ws2 = XLSX.utils.aoa_to_sheet([consHeader, ...consRows]);
  ws2['!cols'] = [{wch:12},{wch:12},{wch:10},{wch:6},{wch:16},{wch:6},{wch:28},{wch:10},{wch:10},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws2, 'اقلام مصرفی');
  XLSX.writeFile(wb, `گزارش_شیفت_${fromVal}_تا_${toVal}.xlsx`);
};

(async () => {
  const overlay = document.getElementById('connectOverlay');
  const msgEl = document.getElementById('connectMsg');
  const checkBtn = document.getElementById('connectCheckBtn');
  function showConnectError(){
    msgEl.textContent = 'اتصال برقرار نشد. لطفاً اینترنت را بررسی و صفحه را دوباره بارگذاری کنید.';
    msgEl.classList.add('err');
    checkBtn.style.display = 'inline-block';
  }
  if (!gasConfigured()){
    console.warn('GAS_URL تنظیم نشده — برنامه فعلاً فقط روی همین مرورگر ذخیره می‌کند و با بقیه هم‌رسانی نمی‌شود.');
  }

  // Google Apps Script (سرور این پنل) گاهی ۱۰ تا ۲۰ ثانیه طول می‌کشد تا
  // جواب بدهد، مخصوصاً بعد از چند دقیقه بی‌کار بودن ("cold start"). به‌جای
  // اینکه کل این مدت پشت صفحه‌ی «در حال اتصال» معطل بمانیم، اگر از قبل
  // نسخه‌ای از داده روی همین مرورگر ذخیره شده باشد (از یک بارگذاری موفق
  // قبلی)، همان را فوراً نشان می‌دهیم؛ داده‌ی واقعی و احتمالاً جدیدتر سرور
  // هم در پس‌زمینه لود می‌شود و به‌محض رسیدن، بی‌سروصدا جایگزین می‌شود.
  const hadSnap = loadSnapshot();
  const legacyCache = !hadSnap && !!localStorage.getItem('shiftpanel:shift-config');
  const hasLocalCache = hadSnap || legacyCache;
  if (legacyCache){
    if (localStorage.getItem('shiftpanel:admin-password')){
      const p = JSON.parse(localStorage.getItem('shiftpanel:admin-password'));
      ADMIN_PASSWORD = (typeof p === 'string') ? p : (p.value || ADMIN_PASSWORD);
    }
    const cfg = JSON.parse(localStorage.getItem('shiftpanel:shift-config'));
    if (cfg) CONFIG = cfg;
    const sup = JSON.parse(localStorage.getItem('shiftpanel:supervisors-list') || 'null');
    if (Array.isArray(sup) && sup.length) SUPERVISORS = sup;
    const staff = JSON.parse(localStorage.getItem('shiftpanel:staff-list') || 'null');
    if (Array.isArray(staff) && staff.length) STAFF = staff;
    reportsStore = localGetPrefix('report:');
    referralsStore = localGetPrefix('referral:');
  }
  if (hasLocalCache){
    // نمایش فوری از نسخه‌ی ذخیره‌شده؛ داده‌ی تازه‌ی سرور در پس‌زمینه می‌آید
    renderCalendarTitle(); await renderCalendarListLocal();
    overlay.classList.add('hidden');
    setTimeout(() => { overlay.style.display = 'none'; }, 300);
  }

  try{
    // مسیر بحرانی فقط دو چیز است: تنظیمات چرخش + ماه‌های قابل‌مشاهده. بقیه (رمز مدیر، فهرست نفرات) بعداً.
    const configPing = gasConfigured() ? gasGet({ action:'get', key:'shift-config' }) : undefined;
    await Promise.all([configPing, loadConfig(configPing), loadMonths(viewMonthKeys())]);
    saveSnapshot();
    if (hasLocalCache) await refreshAllSilently(); else await refreshAll();
    overlay.classList.add('hidden');
    setTimeout(() => { overlay.style.display = 'none'; }, 300);
    loadConfigExtras().then(() => { saveSnapshot(); refreshAllSilently(); }).catch(() => {});
  }catch(e){
    if (!hasLocalCache) showConnectError();
  }
})();

(function(){
  if (!FIREBASE_CONFIG || !VAPID_KEY) return;

  const FB_VER = '10.12.2';

  const getReg = () => { try{ return JSON.parse(localStorage.getItem('push-reg') || 'null'); }catch(e){ return null; } };
  const paintBtn = () => { const r = getReg(); btn.style.background = (r && supported && Notification.permission === 'granted') ? 'var(--green-dim)' : ''; };
  const loadScript = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('load')); document.head.appendChild(el); });
  async function fbMessaging(){
    if (!window.firebase){
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-messaging-compat.js');
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    return firebase.messaging();
  }
  const hash = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + t.length.toString(36) + t.slice(-6).replace(/[^A-Za-z0-9]/g, 'x'); };

  async function obtainToken(){
    const msg = await fbMessaging();
    const reg = await navigator.serviceWorker.ready;
    const token = await msg.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error('notoken');
    // اگر برنامه باز باشد، اعلان به‌صورت دستی نشان داده می‌شود
    msg.onMessage(p => { const n = (p && p.notification) || {}; reg.showNotification(n.title || 'گزارش شیفت', { body: n.body || '', icon: 'icon-192.png', dir: 'rtl', lang: 'fa', tag: 'shift-referral' }); });
    return token;
  }
  async function register(team, name){
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('denied');
    const token = await obtainToken();
    const key = 'pushtoken:' + hash(token);
    const ok = await safeSet(key, { team, name, token, t: Date.now() });
    if (!ok) throw new Error('save');
    localStorage.setItem('push-reg', JSON.stringify({ team, name, key, t: Date.now() }));
  }
  async function unregister(){
    const r = getReg();
    try{ const msg = await fbMessaging(); await msg.deleteToken(); }catch(e){}
    if (r) await safeSet(r.key, { deleted: true, t: Date.now() });
    localStorage.removeItem('push-reg');
  }
  // نوسازی بی‌صدای ثبت (توکن ممکن است عوض شود)
  async function refreshReg(){
    const r = getReg(); if (!r || !supported || Notification.permission !== 'granted') return;
    if (Date.now() - (r.t || 0) < 7 * 86400000) { obtainToken().catch(() => {}); return; }
    try{ await register(r.team, r.name); }catch(e){}
  }

  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;padding:16px';

  const box = ov.firstChild, close = () => { ov.style.display = 'none'; };

  const st = 'font-family:inherit;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;margin-bottom:10px';

  function render(msg){

  }
  btn.onclick = () => { render(); ov.style.display = 'flex'; };
  paintBtn();

})();

/* ---------- PWA: ثبت Service Worker و دکمه‌ی نصب ---------- */
(function(){
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    const hadCtl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl && !reloaded){ reloaded = true; location.reload(); } });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {}));
  }
  let evt = null; const btn = document.createElement('button');
  btn.className = 'icon-btn'; btn.id = 'installBtn'; btn.textContent = '⬇ نصب'; btn.style.display = 'none';
  const row = document.querySelector('.icon-row'); if (row) row.prepend(btn);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evt = e; if (!matchMedia('(display-mode: standalone)').matches) btn.style.display = ''; });
  btn.onclick = async () => { if (!evt) return; evt.prompt(); await evt.userChoice.catch(() => {}); evt = null; btn.style.display = 'none'; };
  window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
})();
